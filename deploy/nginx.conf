server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  server_tokens off;
  client_max_body_size 5m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://patchstorage.com https://lh3.googleusercontent.com; connect-src 'self' https://patchstorage.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ready';
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /_shell.html;
  }
}
